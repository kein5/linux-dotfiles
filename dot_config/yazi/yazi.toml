[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 8
mouse_events = ["click", "scroll"]
title_format = "yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 1800
max_height = 1800
image_delay = 20
image_filter = "triangle"
image_quality = 75

[tasks]
micro_workers = 8
macro_workers = 2
bizarre_retry = 3
suppress_preload = false

[which]
sort_by = "key"
sort_sensitive = false
sort_reverse = false

