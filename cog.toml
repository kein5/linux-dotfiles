from_latest_tag = true
ignore_merge_commits = true
tag_prefix = ""

[changelog]
path = "CHANGELOG.md"
template = "full_hash"

[commit_types]
feat = { changelog_title = "Features", order = 0 }
fix = { changelog_title = "Bug Fixes", order = 1 }
perf = { changelog_title = "Performance", order = 2 }
refactor = { changelog_title = "Refactoring", order = 3 }
docs = { changelog_title = "Documentation", order = 4 }
build = { changelog_title = "Build", order = 5 }
ci = { changelog_title = "CI", order = 6, omit_from_changelog = true }
test = { changelog_title = "Tests", order = 7, omit_from_changelog = true }
style = { changelog_title = "Style", order = 8, omit_from_changelog = true }
chore = { changelog_title = "Chores", order = 9 }

